<!doctype html>
<html><head><meta charset="utf-8"><title>Snap Vanish</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header>
    <div class="brand"><img src="icons/icon48.png" width="28" height="28" alt=""><div><h1>Snap Vanish</h1><p id="sub">Snap your fingers. Turn to dust.</p></div></div>
    <label class="switch" title="Turn Snap Vanish on or off"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <div class="status" id="status"><i class="dot"></i><span id="statusText">Checking this tab…</span></div>

  <button id="snap" class="primary">Snap now</button>

  <section>
    <div class="row"><label for="sens">Snap sensitivity</label><output id="sensOut"></output></div>
    <input type="range" id="sens" min="0" max="100" step="1">
    <div class="hint"><span>Strict</span><span>Easy</span></div>

    <div class="row"><label for="dust">Dust duration</label><output id="dustOut"></output></div>
    <input type="range" id="dust" min="1" max="4" step="0.1">
    <div class="hint"><span>Quick</span><span>Dramatic</span></div>
  </section>

  <section class="checks">
    <label class="check"><input type="checkbox" id="micConfirm"><span>Confirm snaps with the mic click</span></label>
    <label class="check"><input type="checkbox" id="autoMute"><span>Mute mic while I'm gone</span></label>
  </section>

  <section class="foot">
    <div class="row"><span>Backup shortcut</span><kbd id="shortcut">…</kbd></div>
    <div class="links"><a href="#" id="changeKey">Change shortcut</a><a href="#" id="rescan" title="Forget the learned room, e.g. after moving the camera">Re-scan room</a></div>
    <p class="local">Runs entirely in your browser. No video or audio leaves your computer.</p>
  </section>
  <script src="popup.js"></script>
</body></html>
